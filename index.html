<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pitch Trainer">
    <title>Pitch Trainer</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>Pitch Trainer</h1>
            <p id="status" class="status">Loading piano samples...</p>
        </header>

        <section class="settings-card">
            <div class="settings-grid">
                <label>
                    <span>From</span>
                    <select id="startNote"></select>
                </label>

                <label>
                    <span>To</span>
                    <select id="endNote"></select>
                </label>

                <label>
                    <span>Key</span>
                    <select id="keySelect"></select>
                </label>

                <label>
                    <span>Clef</span>
                    <select id="clefSelect">
                        <option>Treble</option>
                        <option>Bass</option>
                        <option>Auto</option>
                    </select>
                </label>
            </div>

            <button id="applyButton" class="secondary full-width" disabled>Apply</button>
        </section>

        <section class="controls">
            <button id="playButton" class="primary" disabled>Play</button>
            <button id="replayButton" class="secondary" disabled>Replay</button>
            <button id="nextButton" class="secondary" disabled>Next</button>
            <button id="stopButton" class="danger" disabled>Stop Test</button>
        </section>

        <section class="answer-card">
            <div id="answerText" class="answer-text">Free play mode</div>
            <svg id="staff" viewBox="0 0 800 180" role="img" aria-label="Music staff"></svg>
        </section>

        <section class="keyboard-card">
            <div id="keyboardScroller" class="keyboard-scroller">
                <div id="keyboard" class="keyboard"></div>
            </div>
        </section>

        <p class="hint">
            In free play mode, tap any key to hear it and see its note name, solfege, and staff position.
        </p>
    </main>

    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <script src="https://surikov.github.io/webaudiofontdata/sound/0000_JCLive_sf2_file.js"></script>
    <script src="./app.js"></script>
</body>
</html>
